<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jenny - AI Chat Assistant</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="app-container">

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">

            <div class="brand">
                <div class="brand-icon">J</div>
                <div>
                    <h2>Jenny</h2>
                    <p>Your AI Assistant</p>
                </div>
            </div>

            <button class="new-chat-btn" id="newChatBtn" type="button">
                <span>+</span> New Chat
            </button>

            <!-- CHAT HISTORY -->
            <div class="history-section">

                <h3>CHAT HISTORY</h3>

                <div class="chat-history" id="chatHistory">

                    <div class="history-item active">
                        <span>▢</span>
                        <p>General Conversation</p>
                        <span class="more">⋮</span>
                    </div>

                    <div class="history-item">
                        <span>▢</span>
                        <p>Coding Help</p>
                        <span class="more">⋮</span>
                    </div>

                    <div class="history-item">
                        <span>▢</span>
                        <p>Study Assistance</p>
                        <span class="more">⋮</span>
                    </div>

                </div>

            </div>

            <!-- SIDEBAR BOTTOM -->
            <div class="sidebar-bottom">

                <button type="button">⚙ Settings</button>
                <button type="button" id="clearChatsBtn">▤ Clear Chats</button>
                <button type="button">⇥ Logout</button>

            </div>

        </aside>

        <!-- MOBILE HISTORY OVERLAY -->
        <div class="history-overlay" id="historyOverlay"></div>

        <!-- MAIN CHAT AREA -->
        <main class="main-content">

            <!-- HEADER -->
            <header class="top-header">

                <button
                    class="history-toggle-btn"
                    id="historyToggleBtn"
                    type="button"
                    aria-label="Open chat history"
                    aria-expanded="false">
                    ☰
                </button>

                <div class="header-title">
                    <h3>Jenny AI</h3>
                    <span class="online-status">● Online</span>
                </div>

                <div class="profile">
                    <div class="profile-avatar">L</div>
                    <span>Likith</span>
                </div>

            </header>

            <!-- CHAT CONTENT -->
            <section class="chat-area" id="chatArea">

                <!-- WELCOME SCREEN -->
                <div class="welcome-screen" id="welcomeScreen">

                    <div class="welcome-icon">J</div>

                    <h1>Welcome to <span>Jenny</span></h1>

                    <p>Your intelligent AI companion. Ask anything, anytime!</p>

                    <div class="suggestion-cards">

                        <button class="suggestion-card" type="button">
                            <span>⌘</span>
                            <h4>Help me with coding</h4>
                            <p>Programming and debugging</p>
                        </button>

                        <button class="suggestion-card" type="button">
                            <span>✦</span>
                            <h4>Explain a concept</h4>
                            <p>Learn something new</p>
                        </button>

                        <button class="suggestion-card" type="button">
                            <span>💡</span>
                            <h4>Explore ideas</h4>
                            <p>Discover creative solutions</p>
                        </button>

                    </div>

                </div>

                <!-- MESSAGES -->
                <div class="messages-container" id="messagesContainer">
                </div>

            </section>

            <!-- MESSAGE INPUT -->
            <footer class="chat-footer">

                <form id="chatForm" class="message-form">

                    <input
                        type="text"
                        id="messageInput"
                        placeholder="Ask Jenny anything..."
                        autocomplete="off"
                    >

                    <!-- IMAGE GENERATION BUTTON -->
                    

                    <!-- SEND MESSAGE BUTTON -->
                    <button type="submit" id="sendBtn">
                        ➤
                    </button>

                </form>

                <p class="footer-note">
                    Jenny can make mistakes. Verify important information.
                </p>

            </footer>

        </main>

    </div>

    <!-- MARKDOWN -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- SYNTAX HIGHLIGHTING -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/python.min.js"></script>

    <!-- JENNY JAVASCRIPT -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
